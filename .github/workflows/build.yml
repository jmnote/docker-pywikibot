name: Build

# Builds and pushes the image of the Pywikibot release named by the tag (X.Y.Z): on a tag push, or run by
# Tag (or by hand) on a tag. latest moves only for the highest tag, so rebuilding an older one keeps it.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: pywikibot-images
  cancel-in-progress: false

env:
  UPSTREAM_REPO: wikimedia/pywikibot
  IMAGE_NAME: pywikibot
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != tag ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run on an X.Y.Z tag, not ${{ github.ref_type }} $version" >&2
            exit 1
          fi
          highest=$(
            git ls-remote --tags --refs "https://github.com/${{ github.repository }}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$version" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Building $version (highest tag: $highest)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/${{ env.UPSTREAM_REPO }}.git#refs/tags/${{ steps.version.outputs.version }}
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
